# DEAD CONFIG. Nothing in this file changes any behaviour as of 2026-08-28.
#
# It carried one key, `high_risk_paths`, whose only job was to select files for
# the OpenAI cascade. That leg is retired (see decisions/0008 and the pre-push
# section of dotfiles/claude/CLAUDE.md), so the key now drives nothing. The
# supported invocation is `review-plan-v2 --static-only`, and the static path
# reads no per-path configuration at all.
#
# The four review briefs that lived here were MOVED to `.coderabbit.yaml` under
# `reviews.path_instructions`, not deleted — each one records a failure that
# actually happened in this code, and CodeRabbit is now the reviewer that can
# act on them.
#
# Kept as a marker rather than removed, because this filename is the exact
# shape of the mistake it is worth remembering: a config file whose name
# matches the tool, containing keys the tool no longer reads, is
# indistinguishable from a config file that is working. Another repo on this
# machine carried a `path_filters:` block here for weeks, believing the
# sensitive prose it holds was being filtered out of review; `path_filters` has
# only ever been read from `.coderabbit.yaml`.
#
# So: do not add configuration to this file. If a future key is genuinely
# needed, delete this marker in the same commit that adds it, so the file never
# again contains a mix of live and dead keys.
#
# Live keys `config.py` still reads, for reference, all of them reviewer-only
# and therefore unreachable under `--static-only`: high_risk_paths,
# max_concurrency, auto_pause_n, dedup_line_window, context_budget_chars,
# always_include_files, import_aliases. And no path filter of any kind.
