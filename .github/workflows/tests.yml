name: tests
# The review-plan-v2 test suite. Until 2026-08-13 this repo's only PR check was
# gitleaks, so "green" meant "no secrets committed" and nothing more — the
# suite ran solely on whichever laptop happened to run it by hand.
#
# That is the same defect the suite itself was just hardened against: a check
# that reports to nobody is indistinguishable from no check. The tests that
# pin the dead-cascade fix (payload shape, empty-content handling, redaction,
# [DEAD-LEG] rendering, the Gemini route regex) protect nothing on a future PR
# unless something runs them.
#
# Deliberately no `continue-on-error`. A warn-first check with no exit
# condition is where checkers go to die; the baseline is green today, so it
# enforces from day one.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-24.04
    # The vendor-guard suites at the end of this job run fixtures that `sleep 600`
    # on purpose, and a lost cap is the exact regression they exist to catch — so
    # unbounded, the failure this job is built to detect would instead run toward
    # the 6-hour default. A job that proves bounds needs one of its own. Raised as
    # a finding against the template's copy of this workflow on 2026-09-01 and
    # applied here too, because the hazard is in the fixtures, not in one repo.
    timeout-minutes: 25
    steps:
      # `persist-credentials: false`: nothing in this job touches a remote, and the
      # guard suites build throwaway git repositories and run fake binaries off a
      # temporary PATH. The default writes the job token into .git/config, right
      # where those fixtures' own git commands run for the rest of the job.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          # Matches the >= 3.10 floor asserted by check_deps.py.
          python-version: '3.12'
      - name: Install the package and its dev extras
        # Was `pip install pytest` against a package that declared no
        # dependencies anywhere. That held while this tool only shelled out to
        # binaries; the gate portfolio needs to PARSE yaml rules and json-schema
        # contracts, so the deps are now declared in pyproject.toml and CI
        # installs the real thing rather than a guess at it.
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      # The structural-rule tests FAIL rather than skip when ast-grep is
      # missing, because a completeness gate that silently does not run reports
      # clean — the defect this portfolio exists to close. That makes the binary
      # a hard CI dependency. Pinned to the same version as the Dockerfile: a
      # skew between CI and the image is exactly how the shellcheck
      # 0.9.0-vs-0.11.0 drift went unnoticed until the first container build.
      - name: Install ast-grep (pinned; must match Dockerfile AST_GREP_VERSION)
        env:
          AST_GREP_VERSION: 0.45.1
          # Must equal Dockerfile AST_GREP_SHA256_AMD64 — a test asserts it
          # (T005d). The runner is x86_64, so this is the amd64 digest.
          AST_GREP_SHA256: 76fb6555be6734fb5057dba8d2fb756430f374bb9e1af694cf1ce00e13238d63
        run: |
          curl -fsSL -o /tmp/ast-grep.zip \
            "https://github.com/ast-grep/ast-grep/releases/download/${AST_GREP_VERSION}/app-x86_64-unknown-linux-gnu.zip"
          # Verified BEFORE unpacking: `unzip` on an unverified archive has
          # already written into /usr/local/bin by the time a later check could
          # object. Same ordering as the Dockerfile, for the same reason.
          echo "${AST_GREP_SHA256}  /tmp/ast-grep.zip" | sha256sum -c -
          sudo unzip -q -o /tmp/ast-grep.zip -d /usr/local/bin
          sudo chmod +x /usr/local/bin/ast-grep /usr/local/bin/sg
          # Anchored on BOTH sides. A bare `*"$want"*` lets "0.45.10" satisfy a
          # pin of "0.45.1"; right-anchoring alone lets "14.53.2" satisfy
          # "4.53.2". The version must be delimited on each end by a character
          # that cannot continue a version number. Keep in sync with the
          # identical function in Dockerfile.
          installed="$(ast-grep --version)"
          case "$installed" in
            "${AST_GREP_VERSION}") echo "ok  ast-grep ${AST_GREP_VERSION}" ;;
            "${AST_GREP_VERSION}"[!0-9.]*) echo "ok  ast-grep ${AST_GREP_VERSION}" ;;
            *[!0-9.]"${AST_GREP_VERSION}") echo "ok  ast-grep ${AST_GREP_VERSION}" ;;
            *[!0-9.]"${AST_GREP_VERSION}"[!0-9.]*) echo "ok  ast-grep ${AST_GREP_VERSION}" ;;
            *) echo "PIN DRIFT: expected ${AST_GREP_VERSION}, got: $installed" >&2; exit 1 ;;
          esac

      # ruff over the whole repo, not just the diff (T005e). The analyzer in
      # the review tool is diff-scoped by design; this step is what keeps THIS
      # repo's own baseline at zero, which is the precondition that let the gate
      # be blocking from its first commit rather than advisory.
      #
      # No `continue-on-error`, for the reason this file's header already gives:
      # the baseline is clean today, so it enforces from day one. ruff arrives
      # via `.[dev]`, pinned exactly in pyproject — see
      # tests/unit/test_toolchain_declared.py.
      - name: Lint (ruff)
        run: |
          ruff --version
          ruff check .

      # gitleaks is a HARD dependency of the pytest job, not a nicety. Without
      # it `tests/integration/test_static_analyzers.py` used to skip — including
      # the test asserting that a diff containing a secret is never transmitted
      # to an external LLM API. That is the strongest security claim this tool
      # makes, and from the day the suite was written until 2026-08-15 CI never
      # ran it once.
      #
      # And the skip was not merely a gap in coverage. MEASURED 2026-08-15 with
      # gitleaks as the ONLY absent tool: the run exits 0 instead of halting,
      # and the secret-bearing diff is sent to the LLM endpoint FOUR times. So
      # in an environment without gitleaks the guarantee is not unverified — it
      # is absent. A skip there reports nothing about a run that leaks.
      #
      # The separate `gitleaks` JOB below scans the repo for committed secrets.
      # It shares no runner with this one, which is why installing it there did
      # nothing for these tests.
      #
      # Pinned to the same version as the Dockerfile, enforced by
      # test_toolchain_declared.py — a comment saying "keep in sync" is not a
      # mechanism, and shellcheck already drifted 0.9.0-vs-0.11.0 that way.
      - name: Install gitleaks (pinned; must match Dockerfile GITLEAKS_VERSION)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          sudo chmod +x /usr/local/bin/gitleaks
          # Anchored on BOTH sides, same as the ast-grep check above: a bare
          # `*"$want"*` lets "8.30.10" satisfy a pin of "8.30.1", and
          # right-anchoring alone lets "18.30.1" satisfy "8.30.1".
          installed="$(gitleaks version)"
          case "$installed" in
            "${GITLEAKS_VERSION}") echo "ok  gitleaks ${GITLEAKS_VERSION}" ;;
            "${GITLEAKS_VERSION}"[!0-9.]*) echo "ok  gitleaks ${GITLEAKS_VERSION}" ;;
            *[!0-9.]"${GITLEAKS_VERSION}") echo "ok  gitleaks ${GITLEAKS_VERSION}" ;;
            *[!0-9.]"${GITLEAKS_VERSION}"[!0-9.]*) echo "ok  gitleaks ${GITLEAKS_VERSION}" ;;
            *) echo "PIN DRIFT: expected ${GITLEAKS_VERSION}, got: $installed" >&2; exit 1 ;;
          esac

      # markdownlint and actionlint were NEVER INSTALLED on this runner.
      #
      # Discovered by the failure proofs on their first CI run: two of the four
      # analyzer gates went red with "not installed, so gate X was not proven at
      # all". The analyzers were configured, documented, and listed in the
      # portfolio — and on this runner their binaries were simply absent, so
      # `StaticAnalyzer.run()` returned `skipped=True` with zero findings every
      # time. Zero findings from a skipped analyzer is byte-identical to a clean
      # result, which is why nothing ever noticed.
      #
      # That is the whole thesis of this phase arriving on schedule: the gates
      # looked present and were not running. Installing them is the fix; the
      # proof failing loudly is the mechanism that will keep them installed.
      - name: Install markdownlint-cli (pinned)
        env:
          MARKDOWNLINT_VERSION: 0.48.0
        run: |
          npm install -g "markdownlint-cli@${MARKDOWNLINT_VERSION}"
          installed="$(markdownlint --version)"
          # Both-side anchored, same as gitleaks above: a bare substring match
          # lets 0.48.01 satisfy a pin of 0.48.0, and right-anchoring alone lets
          # 10.48.0 satisfy it.
          case "$installed" in
            "${MARKDOWNLINT_VERSION}") echo "ok  markdownlint ${MARKDOWNLINT_VERSION}" ;;
            "${MARKDOWNLINT_VERSION}"[!0-9.]*) echo "ok  markdownlint ${MARKDOWNLINT_VERSION}" ;;
            *[!0-9.]"${MARKDOWNLINT_VERSION}") echo "ok  markdownlint ${MARKDOWNLINT_VERSION}" ;;
            *[!0-9.]"${MARKDOWNLINT_VERSION}"[!0-9.]*) echo "ok  markdownlint ${MARKDOWNLINT_VERSION}" ;;
            *) echo "PIN DRIFT: expected ${MARKDOWNLINT_VERSION}, got: $installed" >&2; exit 1 ;;
          esac

      - name: Install actionlint (pinned)
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          curl -fsSL -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          sudo tar -xzf /tmp/actionlint.tar.gz -C /usr/local/bin actionlint
          sudo chmod +x /usr/local/bin/actionlint
          installed="$(actionlint --version | head -1)"
          case "$installed" in
            "${ACTIONLINT_VERSION}") echo "ok  actionlint ${ACTIONLINT_VERSION}" ;;
            "${ACTIONLINT_VERSION}"[!0-9.]*) echo "ok  actionlint ${ACTIONLINT_VERSION}" ;;
            *[!0-9.]"${ACTIONLINT_VERSION}") echo "ok  actionlint ${ACTIONLINT_VERSION}" ;;
            *[!0-9.]"${ACTIONLINT_VERSION}"[!0-9.]*) echo "ok  actionlint ${ACTIONLINT_VERSION}" ;;
            *) echo "PIN DRIFT: expected ${ACTIONLINT_VERSION}, got: $installed" >&2; exit 1 ;;
          esac

      - name: Run the suite
        run: python -m pytest tests/ -q

      # A separate step so "a gate could not be shown to fail" is reported as
      # its own red X rather than buried in the pytest summary line.
      - name: Run the failure proofs
        env:
          # CI holds no provider keys, so the reviewer-wave proof cannot make the
          # live call it needs — and it deliberately will not pretend otherwise.
          # Naming it here is an explicit statement that this run does NOT prove
          # the reviewers still find a planted bug. The runner prints that in the
          # summary of every green run, not only when something breaks.
          #
          # Per-proof on purpose. A blanket "allow unproven" flag would silently
          # cover the next gate that stops working, which is the failure this
          # whole suite exists to prevent. A second live gate must require a
          # second, deliberate edit here.
          RPV2_UNPROVEN_OK: reviewers
        run: bash tests/proofs/run-all.sh

      # The two pre-push guard suites are shell, not pytest, so `pytest tests/`
      # never touched them and until 2026-08-31 NOTHING here did — they ran only
      # on whichever laptop ran them by hand. That is this file's own header
      # complaint about the pytest suite, one directory over: a check that
      # reports to nobody is indistinguishable from no check. `preflight` has
      # eleven review rounds of fail-open history behind it and `bounded` exists
      # because the vendor CLI can hang forever; both are exactly the kind of
      # guard that must not be allowed to rot silently.
      #
      # Neither needs the CodeRabbit CLI, a network, or a provider key: the
      # bounded suite drives fake `coderabbit` binaries on PATH, and the
      # preflight suite builds scratch git repositories. Both are offline and
      # deterministic. Runtime is roughly 45s and 4s respectively; the 45s is
      # mostly deliberate sleeping, because a fake that never hangs would remove
      # the only behaviour worth guarding.
      #
      # Unpiped and unchained on purpose — one step per suite, so a red one is
      # its own X rather than a status swallowed by a pipeline or masked by an
      # earlier `&&`.
      #
      # `if: ${{ !cancelled() }}` on both, and the comment above is why it is
      # needed rather than belt-and-braces. A step with no `if:` carries an
      # implicit `success()`, so an earlier red step SKIPS these two — which is
      # exactly the "masked by an earlier `&&`" failure the paragraph above claims
      # separate steps avoid. It did not avoid it; the masking moved from the shell
      # to the workflow engine and kept reading as a pass, because a skipped guard
      # suite renders as a grey tick and not as an X. Raised by the PR-side review
      # on 2026-09-01, in the same round as the poll-past-deadline defect, and it is
      # the same shape: a check whose absence is indistinguishable from its success.
      #
      # `!cancelled()` rather than `always()`: a cancelled run should stop, and
      # `always()` would keep sleeping through the fakes for another ~90s after
      # someone hit cancel.
      - name: Run the preflight-vendor-review guard suite
        if: ${{ !cancelled() }}
        run: bash scripts/test-preflight-vendor-review.sh

      # This step is also the ONLY place the `setsid` branch of
      # bounded-vendor-review.sh is exercised by a real setsid. macOS has none,
      # so every developer run takes the fallback; see that suite's header for
      # the shim measurement that stood in for this before CI existed.
      - name: Run the bounded-vendor-review guard suite
        if: ${{ !cancelled() }}
        run: bash scripts/test-bounded-vendor-review.sh

      # ...and the step above is the only place the setsid branch runs, which left the
      # OTHER branch running nowhere. Added 2026-09-01, raised by the PR-side review.
      # On ubuntu-24.04 every case takes `setsid`, so the FALLBACK — the one every
      # macOS run takes, and the one defects 2 and 8 both lived in — was exercised on
      # a laptop by hand and by nothing else. Those two are the orphan pair: a kill
      # that reached the child and left the grandchildren holding the vendor socket.
      # Without `setsid` the CLI is not a process-group leader, so `kill -- -$pid`
      # fails and the enumerated `pgrep -P` tree walk is the ENTIRE kill mechanism
      # rather than a backstop. Its suite has to run somewhere that is true.
      #
      # ABSENCE CANNOT BE SHIMMED BY PRECEDENCE. The branch predicate is
      # `command -v setsid`, so a fake `setsid` earlier on PATH leaves it TRUE and this
      # step would silently repeat the branch above while reporting the one below — the
      # failure class both guards exist to remove. The only way in is a PATH with no
      # setsid anywhere on it, hence the symlink farm; the `command -v` check after it
      # is the load-bearing half, because a farm that quietly kept setsid would report
      # a pass for a path it never entered. Proven both ways on 2026-09-01 with a fake
      # setsid ahead of PATH: with the exclusion, exit 0; with the exclusion neutered,
      # the refusal fires and the step is red.
      #
      # Linked by EXECUTABILITY, not by name, because that is what PATH resolution
      # does. Measured the first time this ran: a 644 `~/.local/bin/env` (a uv
      # artifact, not a binary) sat earlier on PATH than /usr/bin/env, the farm linked
      # the name, and 14 cases exited 126. Failing loudly is the safe direction, but
      # it fails for a reason with nothing to do with setsid.
      - name: Run the bounded-vendor-review guard suite with no setsid (the macOS path)
        if: ${{ !cancelled() }}
        run: |
          shim="$RUNNER_TEMP/no-setsid-bin"
          rm -rf "$shim"; mkdir -p "$shim"
          printf '%s\n' "$PATH" | tr ':' '\n' | while read -r d; do
            [ -n "$d" ] || continue
            [ -d "$d" ] || continue
            for f in "$d"/*; do
              { [ -f "$f" ] && [ -x "$f" ]; } || continue
              b=${f##*/}
              if [ "$b" = setsid ]; then continue; fi
              [ -e "$shim/$b" ] || ln -s "$f" "$shim/$b" 2>/dev/null || true
            done
          done
          export PATH="$shim"
          if command -v setsid >/dev/null 2>&1; then
            echo "SHIM FAILED: setsid still reachable at $(command -v setsid)" >&2
            echo "this step would repeat the setsid branch and report it as the fallback" >&2
            exit 1
          fi
          # A REQUIRED-COMMAND FLOOR, because the farm above links binaries one at a
          # time and any link it fails to make turns this step into a suite failure
          # whose message says setsid — the exact outcome the check above exists to
          # prevent, arriving by a different route. internal-speckit-template has
          # carried this floor since 2026-09-01 and THIS repo did not, so the
          # identical suite ran behind it in one of the two places it lives; the same
          # asymmetry the shellcheck step below was added to close. The derivation,
          # and the two rounds of half-enumeration it took, are recorded once in that
          # repo's copy of this step rather than restated here, for the reason
          # scripts/vendor-gate-defect-log.md exists. `[ -x ]` on the RESOLVED path
          # rather than a bare `command -v`: a link to a 644 file is ACCEPTED by bare
          # `command -v` under bash 3.2 and dash and declined under sh and zsh, and a
          # floor whose verdict moves with the interpreter is not one.
          #
          # `git` is in the list because it is the ONE NAME WHOSE ABSENCE THIS FLOOR
          # COULD NOT HAVE CAUGHT AFTER THE FACT: `git rev-parse --abbrev-ref HEAD`
          # exits 127 when unreachable, and the round-key call site in
          # scripts/bounded-vendor-review.sh deliberately reads that as its
          # `no-branch` fallback — so the suite carries on with a directory-only key,
          # every round-cap case silently shares one budget, and the step stays GREEN
          # while fourteen cases mean something other than what they say. Degrades
          # instead of erroring, which is this repo's recurring defect one layer out
          # from the one the floor was added to fix. Its own list needed three rounds
          # in the template repo before it held, all three recorded there.
          for req in bash env git grep sleep mkdir cat awk head chmod date tr tail \
                     pgrep find mktemp sort seq sed rm cut ls dirname touch comm \
                     wc cksum ps id; do
            p=$(command -v "$req" 2>/dev/null) || p=
            if [ -n "$p" ] && [ -x "$p" ]; then continue; fi
            echo "SHIM FAILED: '$req' is not reachable-and-executable through the" >&2
            echo "farm, so this step would fail the suite for a reason with nothing" >&2
            echo "to do with setsid" >&2
            exit 1
          done
          # `find`, not `ls | wc -l`, because SC2012 — actionlint runs shellcheck
          # over every `run:` block here, so this line is linted like a script.
          # (Do not start that sentence with the linter's own name: a comment
          # whose first word is that name parses as a DIRECTIVE, which is
          # SC1072/SC1073 and how this step was red a moment ago.)
          echo "no setsid on PATH; $(find "$shim" -maxdepth 1 -type l | wc -l) links"
          bash scripts/test-bounded-vendor-review.sh

      # Added 2026-09-01. These four files are kept BYTE-IDENTICAL with the copies
      # in internal-speckit-template, whose `guards` workflow shellchecks them —
      # and this one did not, so the identical twin was linted in exactly one of
      # the two places it lives. That asymmetry was not theoretical: the template's
      # job went red on SC2317 across the whole `on_signal` body while this repo
      # stayed green on the same bytes, and the local shellcheck (0.11.0) emitted
      # nothing at all. Two repos, three verdicts, one file.
      #
      # `if: !cancelled()` for the reason the two steps above give: a skipped lint
      # renders as a grey tick, which reads as a pass.
      - name: shellcheck the guards and their suites
        if: ${{ !cancelled() }}
        run: |
          # The runner image ships shellcheck; install only if it does not, so the
          # ordinary path has no network dependency. An `if`, not
          # `command -v ... || apt-get update && apt-get install`, because
          # `A || B && C` parses as `(A || B) && C` and would install every run.
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq shellcheck
          fi
          # `--version` is printed because IT IS PART OF THE FINDING, not decoration.
          # This step runs at the DEFAULT severity (style), so info-tier codes fail it,
          # and the runner's 0.9.0 does not emit the same codes as the 0.10+ that brew
          # ships. A trap-invoked function is the known case: 0.9.0 reports SC2317 on
          # every line of the body, 0.11.0 reports SC2329 once on the definition, so a
          # laptop running `shellcheck -S warning` sees NEITHER and reads clean while
          # this step is red. That is not hypothetical — it is how the round that added
          # `release_claim` got here. To reproduce this step's exact verdict locally,
          # match the version rather than the flags:
          #   curl -sL -o /tmp/sc.tar.xz https://github.com/koalaman/shellcheck/releases/download/v0.9.0/shellcheck-v0.9.0.darwin.x86_64.tar.xz
          #   tar -xJf /tmp/sc.tar.xz -C /tmp && /tmp/shellcheck-v0.9.0/shellcheck scripts/*vendor-review.sh
          # (x86_64 is the only darwin asset for 0.9.0; it runs under Rosetta on arm64.)
          # Deliberately NOT pinned to one version: two versions disagreeing is the
          # coverage, and pinning would hide whichever code the pin does not emit.
          shellcheck --version
          shellcheck scripts/preflight-vendor-review.sh \
                     scripts/test-preflight-vendor-review.sh \
                     scripts/bounded-vendor-review.sh \
                     scripts/test-bounded-vendor-review.sh
